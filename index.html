<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LP-UNSA 3D</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="cabecera"><h1 class="marca">LP-UNSA 3D</h1><p class="sub">Colección paleontológica digital · Laboratorio de Paleontología – UNSA</p></header>
<main><section class="intro"><h2>Modelos 3D de ammonoideos</h2><p>Selección de especímenes digitalizados para visualización durante la presentación de congreso.</p></section><section id="galeria" class="grid"></section></main>
<script type="module">import{catalogo}from'./catalogo.js';const g=document.getElementById('galeria');catalogo.forEach(i=>{const a=document.createElement('article');a.className='card';a.innerHTML=`<div class="card-visual"><div class="ammonite-icon"></div></div><div class="card-body"><p class="codigo">${i.codigo}</p><h3>${i.identificacion}</h3><p class="meta">${i.localidad}<br>${i.edad}</p><div class="acciones"><a class="btn primary" href="visor.html?id=${encodeURIComponent(i.id)}">Ver modelo 3D</a>${i.descarga?`<a class="btn" href="${i.modelo}" download>Descargar GLB</a>`:''}</div></div>`;g.appendChild(a)});</script>
</body></html>
